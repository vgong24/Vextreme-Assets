name: Restore Discovery original representative art

on:
  push:
    paths:
      - "_asset-ingest/discovery-original/**"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify exact derivative
        shell: bash
        run: |
          set -euo pipefail
          out="__assets/39efcc7bd30926dc063997e821b1466a40319c395fbe1ce1a5a8e5a8880a45dd.webp"
          mkdir -p __assets
          cat _asset-ingest/discovery-original/*.b64 | tr -d '\n\r' | base64 -d > "$out"
          echo "39efcc7bd30926dc063997e821b1466a40319c395fbe1ce1a5a8e5a8880a45dd  $out" | sha256sum -c -
          test "$(stat -c %s "$out")" = "99358"
      - name: Commit asset and remove temporary ingest mechanism
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __assets/39efcc7bd30926dc063997e821b1466a40319c395fbe1ce1a5a8e5a8880a45dd.webp
          git rm -r _asset-ingest/discovery-original
          git rm .github/workflows/restore-discovery-original.yml
          git commit -m "VXG-110526: restore original Discovery representative art [VXG RealForever]"
          git push
