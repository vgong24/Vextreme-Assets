name: Reconstruct Truth of Love asset
on:
  push:
    branches:
      - VXG-102926-chatgpt-truth-of-love-cover-asset
permissions:
  contents: write
jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: VXG-102926-chatgpt-truth-of-love-cover-asset
      - name: Reconstruct and verify exact asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p __assets
          cat .vxg-transfer/truth-of-love/*.b64 | base64 -d > __assets/3394ba90aafc4a89f1d1307c6f9267525d05bf68e757d5fa12e1031acbd147d3.jpg
          test "$(wc -c < __assets/3394ba90aafc4a89f1d1307c6f9267525d05bf68e757d5fa12e1031acbd147d3.jpg)" -eq 16204
          echo "3394ba90aafc4a89f1d1307c6f9267525d05bf68e757d5fa12e1031acbd147d3  __assets/3394ba90aafc4a89f1d1307c6f9267525d05bf68e757d5fa12e1031acbd147d3.jpg" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __assets/3394ba90aafc4a89f1d1307c6f9267525d05bf68e757d5fa12e1031acbd147d3.jpg
          git commit -m "VXG-102926: reconstruct Truth of Love cover [VXG RealForever]"
          git push origin HEAD:VXG-102926-chatgpt-truth-of-love-cover-asset
