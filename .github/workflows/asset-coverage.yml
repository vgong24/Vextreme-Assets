name: Asset Coverage Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vextreme-Assets
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout Vextreme
        uses: actions/checkout@v4
        with:
          repository: vgong24/Vextreme
          path: _vextreme
          fetch-depth: 1

      - name: Map Vextreme references to asset store
        run: node scripts/audit-vextreme-assets.mjs --vextreme _vextreme --json asset-audit-report.json

      - name: Print audit summary
        if: always()
        run: node -e "const r=require('./asset-audit-report.json'); console.log(JSON.stringify({canonicalAssets:r.canonicalAssets,uniqueReferencedAssets:r.uniqueReferencedAssets,matchedReferencedAssets:r.matchedReferencedAssets,missingReferencedAssets:r.missingReferencedAssets,coveragePercent:r.coveragePercent,textAssetDependenciesScanned:r.textAssetDependenciesScanned},null,2))"
