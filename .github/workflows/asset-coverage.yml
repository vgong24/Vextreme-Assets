name: Asset Coverage Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vextreme-Assets
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate screenshot evidence custody
        run: node scripts/ingest-screenshot-evidence.mjs --check

      - name: Smoke-test screenshot evidence ingest
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/evidence-smoke"
          mkdir -p "${root}"
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z4J0AAAAASUVORK5CYII=' | base64 -d > "${root}/capture.png"
          node scripts/ingest-screenshot-evidence.mjs \
            --root "${root}" \
            --file "${root}/capture.png" \
            --namespace vextreme \
            --slug smoke-page \
            --locale en \
            --theme default \
            --viewport 1280 \
            --source-repo vgong24/Vextreme \
            --source-commit 0000000000000000000000000000000000000000 \
            --source-path pages/smoke-page.html
          node scripts/ingest-screenshot-evidence.mjs --root "${root}" --check
          test "$(find "${root}/evidence/screenshots" -name '*.png' | wc -l)" -eq 1

      - name: Checkout Vextreme
        uses: actions/checkout@v4
        with:
          repository: vgong24/Vextreme
          path: _vextreme
          fetch-depth: 1

      - name: Map Vextreme references to asset store
        run: node scripts/audit-vextreme-assets.mjs --vextreme _vextreme --json asset-audit-report.json

      - name: Print audit summary
        if: always()
        run: node -e "const r=require('./asset-audit-report.json'); console.log(JSON.stringify({canonicalAssets:r.canonicalAssets,publicSurface:r.publicSurface,fullPreservedCorpus:{uniqueReferencedAssets:r.fullPreservedCorpus.uniqueReferencedAssets,matchedReferencedAssets:r.fullPreservedCorpus.matchedReferencedAssets,missingReferencedAssets:r.fullPreservedCorpus.missingReferencedAssets,coveragePercent:r.fullPreservedCorpus.coveragePercent,textAssetDependenciesScanned:r.fullPreservedCorpus.textAssetDependenciesScanned}},null,2))"

      - name: Prove Pages delivery projection without mutating canonical assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site-smoke
          mkdir _site-smoke
          rsync -a --exclude='.git/' --exclude='_site-smoke/' ./ _site-smoke/
          node scripts/prepare-pages-site.mjs _site-smoke
          git diff --exit-code -- __assets
          ! grep -R --include='*.css' -n '/__assets/' _site-smoke/__assets
          grep -F './b0c618f6d8ea996806c20d04c7348f3f7c8501de55022e499078cca66d400d89.ttf' _site-smoke/__assets/8522599a18c34eb608157e8ca1ca617388de8e187c4744d7c7885bc14d1c569f.css

      - name: Verify current public origin is reachable
        shell: bash
        run: |
          set -euo pipefail
          origin="https://vgong24.github.io/Vextreme-Assets"
          css="__assets/8522599a18c34eb608157e8ca1ca617388de8e187c4744d7c7885bc14d1c569f.css"
          image="__assets/297c8def391af561d445c75a946b36d399e208211c115fa6effdf1085c5595a0.png"
          sigil="__assets/05277887454a79f3b08d8a83685e989b6c46b74d8e48d136b2d16acf77aba4e1.png"

          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors "${origin}/${css}" -o "${RUNNER_TEMP}/live.css"
          test -s "${RUNNER_TEMP}/live.css"
          for rel in "${image}" "${sigil}"; do
            out="${RUNNER_TEMP}/$(basename "${rel}")"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors "${origin}/${rel}" -o "${out}"
            cmp "${rel}" "${out}"
          done

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-audit-report
          path: asset-audit-report.json
